spring.application.name=srv

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Honour X-Forwarded-* headers from Render/Vercel proxies (real client IP for rate limiting)
server.forward-headers-strategy=framework

# Business time zone. Containers run in UTC; all trip/hold times are stored as IST wall-clock.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}
ratelimit.max-requests-per-minute=${RATE_LIMIT_PER_MINUTE:60}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:srv_prosgres}
spring.datasource.password=${DB_PASSWORD:srv_pass_1234}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
# Neon suspends idle compute and closes sockets: recycle connections before that and keep them probed,
# otherwise the first request after a quiet period dies with "connection reset / closed".
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

# "update" creates/extends tables. Once the schema exists you may set JPA_DDL_AUTO=none on Render to
# shave ~20s off every cold start.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=5s
# Only JPA repositories are used; skipping Redis repository scanning removes startup noise and time.
spring.data.redis.repositories.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma separated browser origins allowed to call this API (no trailing slash). Wildcards are allowed.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://seat-reserve-xi.vercel.app,https://seat-reserve-git-main-varunkalambe4294-7255s-projects.vercel.app}
# Also allow any https://*.vercel.app preview deployment. Set to false to lock CORS to the list above.
cors.allow-vercel-previews=${CORS_ALLOW_VERCEL_PREVIEWS:true}

# Wallet top-up is a simulated payment (no real gateway yet) guarded by caps. Set to false to switch it off.
wallet.demo-top-up-enabled=${WALLET_DEMO_TOP_UP_ENABLED:true}
wallet.top-up.daily-limit=${WALLET_TOPUP_DAILY_LIMIT:50000}
wallet.top-up.max-balance=${WALLET_MAX_BALANCE:100000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# /actuator/health/liveness is always UP once the app has booted and does not depend on Redis/DB,
# so Render's health check and the browser "wake-up" probe never flap because of a dependency blip.
management.endpoint.health.probes.enabled=true

# Booking-flow logging. Set LOG_LEVEL_APP=DEBUG to trace a problem; INFO is the production default.
logging.level.com.seat_reservation_system.srv=${LOG_LEVEL_APP:INFO}
