spring.application.name=srv

server.port=${PORT:8080}
server.shutdown=graceful
# Honour X-Forwarded-* headers from Render/Vercel proxies (real client IP for rate limiting)
server.forward-headers-strategy=framework

# Business time zone. Containers run in UTC; all trip/hold times are stored as IST wall-clock.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
spring.jackson.time-zone=${APP_TIMEZONE:Asia/Kolkata}
ratelimit.max-requests-per-minute=${RATE_LIMIT_PER_MINUTE:60}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
spring.datasource.username=${DB_USERNAME:srv_prosgres}
spring.datasource.password=${DB_PASSWORD:srv_pass_1234}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://seat-reserve-xi.vercel.app,https://seat-reserve-git-main-varunkalambe4294-7255s-projects.vercel.app,https://*.vercel.app}

# Wallet top-up is a simulated payment (no real gateway yet) guarded by caps. Set to false to switch it off.
wallet.demo-top-up-enabled=${WALLET_DEMO_TOP_UP_ENABLED:true}
wallet.top-up.daily-limit=${WALLET_TOPUP_DAILY_LIMIT:50000}
wallet.top-up.max-balance=${WALLET_MAX_BALANCE:100000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Booking-flow logging. Set LOG_LEVEL_APP=DEBUG to trace a problem; INFO is the production default.
logging.level.com.seat_reservation_system.srv=${LOG_LEVEL_APP:INFO}


